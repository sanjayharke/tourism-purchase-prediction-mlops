name: Tourism Purchase Prediction Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tourism-mlops-${{ github.ref }}
  cancel-in-progress: false

jobs:
  register-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Validate and register dataset
        run: python tourism_project/model_building/data_register.py

      - name: Upload registered dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: |
            tourism_project/data/tourism.csv
            tourism_project/data/dataset_manifest.json
          if-no-files-found: error

  prepare-data:
    needs: register-data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Download registered dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data

      - name: Clean data and create stratified splits
        run: python tourism_project/model_building/prep.py

      - name: Upload train/test split artifacts
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/splits/
          if-no-files-found: error

  train-track-evaluate:
    needs: prepare-data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tourism_project/requirements.txt

      - name: Install project dependencies
        run: python -m pip install -r tourism_project/requirements.txt

      - name: Download train/test split artifacts
        uses: actions/download-artifact@v4
        with:
          name: data-splits
          path: tourism_project/artifacts/splits

      - name: Tune, track, evaluate, and package model
        run: python tourism_project/model_building/train.py

      - name: Run packaged-model smoke test
        run: python tourism_project/model_building/smoke_test.py

      - name: Upload MLflow and evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation
          path: |
            mlruns/
            tourism_project/artifacts/reports/
          if-no-files-found: error

      - name: Commit trained model to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/model.joblib
          git add tourism_project/deployment/model_metadata.json
          if git diff --cached --quiet; then
            echo "No model change to commit"
          else
            git commit -m "Update trained tourism model [skip ci]"
            git push origin HEAD:main
          fi

